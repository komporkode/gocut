name: Release macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: npm ci
      - run: wails build -platform darwin/universal -clean
      - run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent GoCut.app gocut-v0.7.0-macos-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v0.7.0'
          files: build/bin/gocut-v0.7.0-macos-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
